name: Vector Game Runtime
on:
  pull_request:
    paths:
      - "src/plugins/vector-game-runtime/**"
      - "src/plugins/index.ts"
      - "localization/en.ftl"
      - ".github/workflows/vector-game-runtime.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:types
      - run: npm run lint:eslint
      - run: npm run test:unit -- --runTestsByPath src/plugins/vector-game-runtime/MazeDemoEngine.unit.test.ts
      - run: npm run build
